
<div class="min-h-screen bg-emerald-50/60 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-emerald-100 overflow-hidden">

    <div class="bg-emerald-600 px-8 py-8 text-center text-white">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-white/15 flex items-center justify-center mb-4">
        <i class="bi bi-recycle text-4xl"></i>
      </div>

      <h1 class="text-2xl font-extrabold">ECOCycle</h1>
      <p class="text-emerald-50 text-sm mt-2">
        Thiết bị cũ, vòng đời mới
      </p>
    </div>

    <div class="p-7 sm:p-8">
      <h2 class="text-xl font-bold text-gray-900">
        Chào mừng trở lại!
      </h2>

      <p class="text-sm text-gray-500 mt-1 mb-6">
        Đăng nhập để tiếp tục sử dụng ECOCycle.
      </p>

      @if (errorMessage) {
        <div class="mb-5 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
          <i class="bi bi-exclamation-circle mr-2"></i>
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm"
            class="space-y-5">

        <div>
          <label for="identifier"
                 class="block text-sm font-semibold text-gray-700 mb-2">
            Username, email hoặc mã người dùng
          </label>

          <div class="relative">
            <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

            <input
              id="identifier"
              name="identifier"
              type="text"
              [(ngModel)]="identifier"
              required
              autocomplete="username"
              placeholder="Nhập tài khoản của bạn"
              class="w-full pl-11 pr-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
            />
          </div>
        </div>

        <div>
          <label for="password"
                 class="block text-sm font-semibold text-gray-700 mb-2">
            Mật khẩu
          </label>

          <div class="relative">
            <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
              placeholder="Nhập mật khẩu"
              class="w-full pl-11 pr-12 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
            />

            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-emerald-600"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loading || loginForm.invalid"
          class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold text-sm shadow-lg shadow-emerald-100 transition">
          @if (loading) {
            <i class="bi bi-arrow-repeat animate-spin mr-2"></i>
            Đang đăng nhập...
          } @else {
            <i class="bi bi-box-arrow-in-right mr-2"></i>
            Đăng nhập
          }
        </button>
      </form>

      <div class="relative my-6">
        <div class="border-t border-gray-100"></div>
        <span class="absolute left-1/2 -translate-x-1/2 -top-2.5 bg-white px-3 text-xs text-gray-400">
          HOẶC
        </span>
      </div>

      <p class="text-center text-sm text-gray-600">
        Chưa có tài khoản?
        <a routerLink="/register"
           class="text-emerald-700 font-bold hover:underline">
          Đăng ký ngay
        </a>
      </p>

      <p class="text-center text-xs text-gray-400 mt-6">
        Cùng ECOCycle xây dựng nền kinh tế tuần hoàn.
      </p>
    </div>
  </div>
</div>
