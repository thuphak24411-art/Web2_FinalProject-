<form class="expert-form" novalidate (ngSubmit)="submitAssessment()">
  <header class="expert-form-heading">
    <span class="expert-form-icon"><i class="bi bi-person-workspace"></i></span>
    <div>
      <h3>Đánh giá của chuyên gia</h3>
      <p>Ghi nhận kết quả kiểm tra thực tế và đề xuất hướng xử lý phù hợp.</p>
    </div>
  </header>
  @if (errorMessage) {
    <p class="expert-form-error" role="alert"><i class="bi bi-exclamation-circle"></i> {{ errorMessage }}</p>
  }
  @if (validationError) {
    <p class="expert-form-error" role="alert"><i class="bi bi-exclamation-circle"></i> {{ validationError }}</p>
  }
  <label class="expert-summary-field">Đánh giá tổng quan <b>*</b>
    <textarea name="specialistSummary" [(ngModel)]="summary" required minlength="10" maxlength="3000" rows="3" placeholder="Mô tả tình trạng thiết bị sau khi kiểm tra"></textarea>
  </label>
  <div class="expert-form-grid">
    <fieldset>
      <legend><i class="bi bi-tools"></i> Sửa chữa</legend>
      <label>Đề xuất <b>*</b><textarea name="repairRecommendation" [(ngModel)]="recommendations.repair" required maxlength="3000" rows="3" placeholder="Phương án và linh kiện cần xử lý"></textarea></label>
      <label>Chi phí tham khảo (VNĐ)<input name="repairPrice" type="number" min="0" max="1000000000" step="1" [(ngModel)]="prices.repair.amountVnd"></label>
      <label>Cơ sở báo giá<textarea name="repairRationale" [(ngModel)]="prices.repair.rationale" maxlength="1000" rows="2"></textarea></label>
    </fieldset>
    <fieldset>
      <legend><i class="bi bi-tag"></i> Bán lại</legend>
      <label>Đề xuất <b>*</b><textarea name="resellRecommendation" [(ngModel)]="recommendations.resell" required maxlength="3000" rows="3" placeholder="Tình trạng và lưu ý khi bán lại"></textarea></label>
      <label>Giá tham khảo (VNĐ)<input name="resellPrice" type="number" min="0" max="1000000000" step="1" [(ngModel)]="prices.resell.amountVnd"></label>
      <label>Cơ sở báo giá<textarea name="resellRationale" [(ngModel)]="prices.resell.rationale" maxlength="1000" rows="2"></textarea></label>
    </fieldset>
  </div>
  <button class="expert-submit" type="submit" [disabled]="submitting || summary.trim().length < 10 || !recommendations.repair.trim() || !recommendations.resell.trim()">
    <i class="bi bi-send-check"></i> {{ submitting ? 'Đang lưu đánh giá...' : 'Gửi đánh giá để người dùng lựa chọn' }}
  </button>
</form>
