<div class="max-w-[800px] mx-auto px-4 py-8">
  <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100">
    
    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
      <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-bold">
        <i class="bi bi-plus-circle-fill"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900">Đăng Bán Thiết Bị Điện Tử Cũ</h1>
        <p class="text-xs text-gray-500">Tái chế thiết bị cũ của bạn để tích lũy Green Coin bảo vệ môi trường</p>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Tên sản phẩm thiết bị *</label>
        <input 
          type="text" 
          [(ngModel)]="title" 
          name="title" 
          required 
          placeholder="Ví dụ: Laptop Dell XPS 13 9305 Core i5 8GB/256GB"
          class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:border-emerald-500 focus:bg-white"
        />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Danh mục thiết bị *</label>
          <select 
            [(ngModel)]="cateID" 
            name="cateID"
            class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:border-emerald-500 focus:bg-white"
          >
            <option value="c1">Máy tính bảng</option>
            <option value="c2">Điện thoại</option>
            <option value="c3">Laptop</option>
            <option value="c4">Linh kiện (RAM/SSD/CPU/GPU)</option>
            <option value="c5">Phụ kiện điện tử</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Độ mới / Tình trạng máy *</label>
          <select 
            [(ngModel)]="condition" 
            name="condition"
            class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:border-emerald-500 focus:bg-white"
          >
            <option value="Mới 99%">Mới 99% (Như mới)</option>
            <option value="Mới 95%">Mới 95% (Rất đẹp)</option>
            <option value="Mới 90%">Mới 90% (Khá mới)</option>
            <option value="Đã qua sử dụng">Đã qua sử dụng</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Giá mong muốn bán (VNĐ) *</label>
        <input 
          type="text" 
          [(ngModel)]="fromPrice" 
          name="fromPrice" 
          required 
          placeholder="Ví dụ: 5.500.000₫"
          class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:border-emerald-500 focus:bg-white"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Mô tả chi tiết tình trạng thiết bị</label>
        <textarea 
          rows="4" 
          [(ngModel)]="description" 
          name="description" 
          placeholder="Nêu rõ tình trạng pin, vết xước, phụ kiện đi kèm..."
          class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-sm focus:outline-none focus:border-emerald-500 focus:bg-white"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
        <button 
          type="button" 
          (click)="cancel()"
          class="px-6 py-3 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50"
        >
          Hủy bỏ
        </button>
        <button 
          type="submit" 
          class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-md shadow-emerald-200"
        >
          Đăng Bán Ngay
        </button>
      </div>
    </form>

  </div>
</div>
