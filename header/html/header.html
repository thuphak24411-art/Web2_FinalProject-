<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Header — ECOCycle</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- Biến dùng chung (màu, font) nằm ở thư mục shared/ -->
<link rel="stylesheet" href="../shared/css/variables.css" />
<link rel="stylesheet" href="../shared/css/base.css" />
<!-- CSS riêng của header -->
<link rel="stylesheet" href="css/header.css" />
</head>
<body>

<header class="site-header">
  <div class="header-card">
    <a class="logo" href="/">
      <img class="logo-mark" src="assets/ecocycle-logo.svg" alt="ECOCycle logo">
      <span class="logo-text">ECOCycle</span>
    </a>

    <nav class="main-nav">
      <a href="/mua-hang" class="is-active">Mua hàng</a>
      <a href="/sua-chua">Sửa chữa</a>
      <a href="/tai-che">Tái chế</a>
      <a href="/ve-chung-toi">Về chúng tôi</a>
    </nav>

    <div class="header-actions">

      <!-- Search -->
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>

        <input 
          type="text" 
          placeholder="Bạn muốn tìm gì?"
          aria-label="Tìm kiếm"
        />
      </div>


      <!-- Notification -->
      <a class="icon-btn notification-btn" href="/thong-bao" aria-label="Thông báo">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M13.5 21a2 2 0 0 1-3 0"/>
        </svg>

        <span class="notification-dot"></span>

      </a>


      <!-- Account -->
      <a class="icon-btn" href="/tai-khoan" aria-label="Tài khoản">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>

      </a>


      <!-- Cart -->
      <a class="icon-btn cart-btn" href="/gio-hang" aria-label="Giỏ hàng">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="20" r="1.4"/>
          <circle cx="18" cy="20" r="1.4"/>
          <path d="M2.5 3h2.4l2.6 12.6h10.8L21 7.5H6"/>
        </svg>

        <span class="cart-badge">3</span>

      </a>


      <button class="menu-toggle" aria-label="Mở menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

    </div>


  </div>
</header>

<!-- Nội dung minh hoạ chỉ để xem header nổi trên nền, xoá khi ghép vào trang thật -->
<main class="demo-content">
  <h1>Cho thiết bị cũ một vòng đời mới.</h1>
  <p>Cuộn để kiểm tra hiệu ứng sticky của thanh header dạng thẻ nổi.</p>
</main>

<script src="js/header.js"></script>
</body>
</html>
